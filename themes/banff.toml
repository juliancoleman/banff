# The "pens" palette from ~/dotfiles/qs qml/shell/Common/Theme.qml (dark). One palette:
# light mirrors dark, because the qs shell runs dark only.

[light]
background = "#000000"
surface = "#000000"
elevatedSurface = "#14181B"
foreground = "#F2F0EA"
secondaryForeground = "#AEB5B9"
mutedForeground = "#F2F0EB4D"
border = "#D1DBE024"
accent = "#8AA5C0"
accentForeground = "#111922"
success = "#7E9C88"
error = "#7A2536"
focus = "#8AA5C0"

[dark]
background = "#000000"
surface = "#000000"
elevatedSurface = "#14181B"
foreground = "#F2F0EA"
secondaryForeground = "#AEB5B9"
mutedForeground = "#F2F0EB4D"
border = "#D1DBE024"
accent = "#8AA5C0"
accentForeground = "#111922"
success = "#7E9C88"
error = "#7A2536"
focus = "#8AA5C0"
