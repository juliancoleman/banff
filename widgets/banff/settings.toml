# Root options, shown in Settings > Styles & Widgets > Island. Declaring any root option also makes
# that page list the island's components (including Weather and its location editor) instead of
# "defined by its style". Choice labels come from strings/en.toml.

[options.presentation]
type = "choice"
title = "Housing"
default = "notch"
choices = ["notch", "pill"]

[options.shadow]
type = "boolean"
title = "Shadow"
default = true

[options.use24Hour]
type = "boolean"
title = "24-hour clock"
default = false

[options.meridiem]
type = "boolean"
title = "AM / PM"
default = false

[options.batteryPercentage]
type = "choice"
title = "Battery percentage"
default = "low"
choices = ["low", "always"]
